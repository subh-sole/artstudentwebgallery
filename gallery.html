    // Function to toggle the menu on mobile devices
    function toggleMenu() {
        var menu = document.querySelector('nav ul');
        menu.classList.toggle('show');

    function disableRightClick(event) {
        event.preventDefault();
    }

    document.addEventListener('contextmenu', disableRightClick);

    const gallery = document.querySelector('.gallery');
    const pagination = document.querySelector('.pagination');
    const searchInput = document.getElementById('searchInput');
    let currentPage = 1;
    let itemsPerPage = 12;
    let currentCategory = '';

    // Display gallery items
    function displayGalleryItems(items) {
        gallery.innerHTML = '';
        for (let i = 0; i < items.length; i++) {
            const item = items[i];

            const galleryItem = document.createElement('div');
            galleryItem.classList.add('gallery-item');

            const anchor = document.createElement('a');
            anchor.href = 'page-url'; // Replace 'page-url' with the actual URL you want the image to link to

            const image = document.createElement('img');
            image.src = item.image;
            image.alt = item.title;

            const overlay = document.createElement('div');
            overlay.classList.add('overlay');

            const overlayContent = document.createElement('div');
            overlayContent.classList.add('overlay-content');

            const title = document.createElement('h3');
            title.textContent = item.title;

            const description = document.createElement('p');
            description.textContent = item.description;

            /*overlayContent.appendChild(title);*/
            overlayContent.appendChild(description);
            overlay.appendChild(overlayContent);
            anchor.appendChild(image);

            galleryItem.appendChild(anchor);
            galleryItem.appendChild(overlay);
            gallery.appendChild(galleryItem);

            anchor.addEventListener('click', displayImage);

        }
    }

    const frontView = document.querySelector('.front-view');

    function displayImage(event) {
        event.preventDefault();
        const imageUrl = event.target.src;
        const title = event.target.alt;

        const frontViewImage = document.createElement('img');
        let text = imageUrl;
        text = text.replace('drive-download-20230713T032251Z-001', 'drive-download-20230713T032251Z-002');
        frontViewImage.src = text;
        frontViewImage.alt = title;

        frontView.innerHTML = '';
        frontView.appendChild(frontViewImage);

        const closeButton = document.createElement('button');
        closeButton.classList.add('close-button');
        closeButton.textContent = 'x';
        closeButton.addEventListener('click', function () {
            frontView.classList.remove('active');
        });

        frontView.appendChild(closeButton);

        frontView.classList.add('active');
    }

    // Event listener for pagination buttons
    pagination.addEventListener('click', function (event) {
        if (event.target.tagName === 'BUTTON') {
            currentPage = parseInt(event.target.textContent);
            displayGalleryItems(getCurrentPageItems());
            generatePaginationButtons(getTotalPages(), currentPage);
        }
    });

    // Generate pagination buttons
    function generatePaginationButtons(totalPages, currentPage) {
        pagination.innerHTML = '';
        for (let i = 1; i <= totalPages; i++) {
            const button = document.createElement('button');
            button.textContent = i;
            if (i === currentPage) {
                button.classList.add('active');
            }
            button.addEventListener('click', function () {
                currentPage = i;
                displayGalleryItems(getCurrentPageItems());
                generatePaginationButtons(totalPages, currentPage);
            });
            pagination.appendChild(button);
        }
    }
    // Get current page items based on items per page and current page
    function getCurrentPageItems() {
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        return getFilteredItems().slice(startIndex, endIndex);
    }

    // Get filtered items based on search input and category
    function getFilteredItems() {
        const searchValue = searchInput.value.toLowerCase();
        return galleryItems.filter((item) => {
        const categoryMatch = currentCategory === '' || item.category === currentCategory;
        const titleMatch = item.title.toLowerCase().includes(searchValue);
        const descriptionMatch = item.description.toLowerCase().includes(searchValue);
        return categoryMatch && (titleMatch || descriptionMatch);
        });
    }

    // Event listeners for search input
    searchInput.addEventListener('input', function () {
        currentPage = 1;
        displayGalleryItems(getCurrentPageItems());
        generatePaginationButtons(getTotalPages(), currentPage);
    });

    // Event listener for category buttons
    const categoryButtons = document.querySelectorAll('.category-button');
    categoryButtons.forEach((button) => {
        button.addEventListener('click', function () {
            
            currentCategory = button.getAttribute('data-category');
            currentPage = 1;
            displayGalleryItems(getCurrentPageItems());
            generatePaginationButtons(getTotalPages(), currentPage);
            
        });
    });
    function selectCategory(category) {
        currentCategory = category;
        currentPage = 1;
        displayGalleryItems(getCurrentPageItems());
        generatePaginationButtons(getTotalPages(), currentPage);
    }

    // Function to reset the CSS for all the buttons
    function resetButtonStyles() {
        const buttons = document.querySelectorAll('.category-button');
        buttons.forEach(button => {
            button.classList.remove('active');
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        const allCategoriesButton = document.querySelector('.category-button[data-category=""]');
        allCategoriesButton.click();
        // Get the query parameters from the URL
        const urlParams = new URLSearchParams(window.location.search);

        // Check if the 'category' parameter exists in the URL
        if (urlParams.has('category')) {
            // Get the value of the 'category' parameter
            const category = urlParams.get('category');

            // Find the corresponding category button
            const categoryButtons = document.querySelectorAll('.category-button');
            categoryButtons.forEach((button) => {
            const dataCategory = button.getAttribute('data-category');
            if (dataCategory === category) {
                // Activate the corresponding category button
                resetButtonStyles(); // Reset the styles for all buttons
                button.classList.add('active'); // Add 'active' class to the corresponding button
                currentCategory = category; // Set the current category
                currentPage = 1; // Reset the current page
                displayGalleryItems(getCurrentPageItems());
                generatePaginationButtons(getTotalPages(), currentPage);
            }
            });
        }
    });

    // Function to create and update category buttons
    function createCategoryButtons() {
        const uniqueCategories = ['', ...new Set(galleryItems.map(item => item.category))];
        const categorySelect = document.getElementById('categorySelect');
        categorySelect.innerHTML = '';

        uniqueCategories.forEach(category => {
            const button = document.createElement('button');
            button.textContent = category === '' ? 'All' : category;
            button.setAttribute('data-category', category);
            button.classList.add('category-button');
            button.addEventListener('click', function () {
            resetButtonStyles(); // Reset the styles for all buttons
            button.classList.add('active'); // Add 'active' class to the clicked button
            selectCategory(category);
            });
            categorySelect.appendChild(button);
        });
    }

    // Call the function to create category buttons initially
    createCategoryButtons();

    // Get total number of pages based on filtered items and items per page
    function getTotalPages() {
        const filteredItems = getFilteredItems();
        return Math.ceil(filteredItems.length / itemsPerPage);

    displayGalleryItems(getCurrentPageItems());
    generatePaginationButtons(getTotalPages(), currentPage);

    searchInput.addEventListener('input', function () {
        currentPage = 1;
        displayGalleryItems(getCurrentPageItems());
        generatePaginationButtons(getTotalPages(), currentPage);
    });

</script>
</body>
